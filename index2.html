<!DOCTYPE html>
<html>
<head>
<title>Card Carousel</title>
<style>
.carousel-container {
  width: 80%;
  margin: 20px auto;
  overflow: hidden;
  position: relative;
}

.carousel-wrapper {
  display: flex;
  transition: transform 0.3s ease-in-out;
}

.card {
  min-width: 200px;
  height: 150px;
  background-color: #f0f0f0;
  border: 1px solid #ccc;
  margin-right: 10px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.carousel-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background-color: rgba(0, 0, 0, 0.5);
  color: white;
  border: none;
  padding: 10px;
  cursor: pointer;
}

.prev-btn {
  left: 0;
}

.next-btn {
  right: 0;
}
</style>
</head>
<body>

<div class="carousel-container">
  <div class="carousel-wrapper">
    <div class="card">Card 1</div>
    <div class="card">Card 2</div>
    <div class="card">Card 3</div>
    <div class="card">Card 4</div>
    <div class="card">Card 5</div>
     <div class="card">Card 5</div>
      <div class="card">Card 5</div>
       <div class="card">Card 5</div>
        <div class="card">Card 5</div>
        
  </div>
  <button class="carousel-btn prev-btn" onclick="moveCarousel(-1)">&#8249;</button>
  <button class="carousel-btn next-btn" onclick="moveCarousel(1)">&#8250;</button>
</div>

<script>
const carouselWrapper = document.querySelector('.carousel-wrapper');
const cards = document.querySelectorAll('.card');
let cardWidth = cards[0].offsetWidth + 10; // Card width + margin
let currentIndex = 0;

function moveCarousel(direction) {
  currentIndex += direction;
  if (currentIndex < 0) {
    currentIndex = cards.length - 1;
  } else if (currentIndex >= cards.length) {
    currentIndex = 0;
  }
  updateCarousel();
}

function updateCarousel() {
  carouselWrapper.style.transform = `translateX(${-currentIndex * cardWidth}px)`;
}
</script>

</body>
</html>
